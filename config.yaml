# Per-role models as "provider:model". Only the ollama provider exists so far.
models:
  lead: ollama:gemma3:4b
  worker: ollama:qwen2.5-coder:7b
  reviewer: ollama:qwen2.5-coder:7b
  # Optional. At the rejection cap this model gets one attempt before the owner is asked.
  # Must differ from the worker to be useful (`ollama pull qwen3:8b`).
  # Delete the line to turn escalation off.
  escalation: ollama:qwen3:8b

# Per-role model options (only reasoning, num_predict and temperature are accepted).
# Escalation runs with thinking OFF: in the 2026-10-29 experiment (README, "Escalation findings")
# that made attempts about three times faster and rescued no fewer of them. `reasoning: null`
# restores the model's own default (thinking on; its reasoning is stripped from the answer).
model_options:
  escalation:
    reasoning: false

max_rejections: 3
test_timeout: 15

# check node isolation: docker (no network, read-only, capped). `local` is NOT isolated and
# will not load unless the environment variable AGENT_LOOP_ALLOW_LOCAL=1 is also set.
sandbox: docker
# Pinned by digest so a changed upstream tag cannot alter the sandbox. Refresh on purpose:
# docker pull python:3.12-slim, then copy the digest from: docker image inspect python:3.12-slim
sandbox_image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
sandbox_memory: 256m
sandbox_cpus: 1

# type: project tasks: pytest on a read-only workspace in the same kind of container
project_memory: 512m
max_project_bytes: 500000    # refuse to copy a bigger project into a workspace
max_context_chars: 12000     # how much of the project the worker is shown per prompt
num_ctx: 8192                # Ollama context window; raise it if the project prompt is truncated
project_test_timeout: 120
