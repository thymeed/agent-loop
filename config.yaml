# Per-role models as "provider:model". Only the ollama provider exists so far.
models:
  lead: ollama:gemma3:4b
  worker: ollama:qwen2.5-coder:7b
  reviewer: ollama:qwen2.5-coder:7b
  # Optional. At the rejection cap this model gets one attempt before the owner is asked.
  # Must differ from the worker to be useful. Pull it first (`ollama pull qwen3:8b`),
  # then uncomment. Delete the line to turn escalation off.
  # escalation: ollama:qwen3:8b

max_rejections: 3
test_timeout: 15

# check node isolation: docker (no network, read-only, capped) or local (NOT isolated)
sandbox: docker
sandbox_image: python:3.12-slim
sandbox_memory: 256m
sandbox_cpus: 1
